<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firm OS Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">indefine</p>
        <p class="brand-sub">Firm OS Companion</p>
      </div>
    </div>
    <button type="button" id="refresh" class="btn btn-sm">Refresh</button>
  </header>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <main id="view" class="wrap" aria-busy="true">
    <p class="fine">Loading your current task…</p>
  </main>
  <p id="announce" class="sr-only" aria-live="polite"></p>
  <footer class="foot">
    <p class="fine">Read-only. This panel never reads, fills or submits any page. You file, sign and pay yourself.</p>
    <p class="fine"><button type="button" id="open-options" class="btn btn-sm">Options</button></p>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
